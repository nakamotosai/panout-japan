<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="东亚 3D 震源">
  <!-- 对齐右上角小地球：深灰球壳 + 米色岸线 + 经纬网 + 橙三角 N -->
  <defs>
    <clipPath id="ball">
      <circle cx="64" cy="64" r="54"/>
    </clipPath>
    <radialGradient id="shellShade" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3c3836"/>
      <stop offset="55%" stop-color="#282828"/>
      <stop offset="100%" stop-color="#1d2021"/>
    </radialGradient>
  </defs>
  <!-- 透明底；球外不描蓝边 -->
  <circle cx="64" cy="64" r="54" fill="url(#shellShade)"/>
  <!-- 经纬网（与 minimap gridA/gridB 同系） -->
  <g clip-path="url(#ball)" fill="none" stroke="#504945" stroke-width="1" opacity="0.55">
    <ellipse cx="64" cy="64" rx="18" ry="54"/>
    <ellipse cx="64" cy="64" rx="36" ry="54"/>
    <line x1="64" y1="10" x2="64" y2="118"/>
    <ellipse cx="64" cy="64" rx="54" ry="18"/>
    <ellipse cx="64" cy="64" rx="54" ry="36"/>
    <line x1="10" y1="64" x2="118" y2="64"/>
  </g>
  <!-- 简化岸线：东亚 + 澳（米色 #ebdbb2 = coast） -->
  <g clip-path="url(#ball)" fill="none" stroke="#ebdbb2" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <!-- 日本列岛示意 -->
    <path d="M86 38c2 3 3 7 2 11-1 5-4 9-5 13 1 1 3 2 3 4 0 3-3 5-5 6"/>
    <path d="M80 48c1 4 0 8-2 11"/>
    <!-- 中国东部/朝鲜半岛轮廓 -->
    <path d="M68 36c4 2 7 7 8 12 1 6-1 12-4 17-2 3-5 6-6 9"/>
    <path d="M62 44c2 5 2 10 0 15-1 3-3 5-4 8"/>
    <!-- 台/南 -->
    <path d="M82 68c1 3 0 6-2 8"/>
    <!-- 东南亚/印尼弧 -->
    <path d="M70 78c6 2 12 6 14 12 1 3 0 6-2 9"/>
    <path d="M78 88c4 1 8 4 9 8"/>
    <!-- 澳洲 -->
    <path d="M88 96c6 1 12 5 14 11 1 4-1 8-5 10-5 3-12 2-16-1-3-2-5-6-4-10 1-4 5-8 11-10z"/>
    <path d="M58 92c3 4 4 9 2 13"/>
  </g>
  <!-- 轻微暗边，贴近小地球圆窗 -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#1d2021" stroke-width="2.5" opacity="0.55"/>
  <!-- 橙三角航向标（尖朝上=N），对齐 minimap marker 0xfe8019 -->
  <g transform="translate(64,28)">
    <path d="M0,-9 L6,7 L0,3.5 L-6,7 Z" fill="#fe8019"/>
  </g>
</svg>
